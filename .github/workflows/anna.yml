name: Anna
# ONE runner, every trigger. Anna's capabilities must not depend on which event
# woke him.
#
# This file replaces morning-knock.yml + log-knock-response.yml + push-queue.yml
# (2026-07-24, Andrew). Those three grew separately and each got exactly the
# secrets its first job happened to need: the knock had GCP + OpenRouter, the
# reply judge had OpenRouter only, the drain had neither. So "can Anna render
# audio right now?" was answerable only by knowing which YAML file was running —
# an accident of file layout, not a design. That accident is what refused a
# bespoke 8pm voice greeting on 2026-07-24 while the knock tick was rendering
# Tamil TTS in this very same cloud, every single day. Consolidated so the
# question can no longer be asked: every lane carries every secret, and
# scheduling, judging, rendering and pushing are first-class tools regardless of
# what woke Anna up.
#
# The drain runs FIRST on every wake-up, unconditionally (Andrew, 2026-07-24).
# Ordering is load-bearing: the drain logs its fire into knock_log.json, and
# rails_gate counts today's reaches when deciding whether to knock — so a
# scheduled push correctly suppresses an ambient knock in the same tick. Drain
# LAST would double-push. It also means timed pushes now get a delivery
# opportunity on every reply and every dispatch, not only on the clock tick.
on:
  schedule:
    # The cron does not encode a schedule — the rails in morning_knock.py do the
    # DST-correct waking-hours filtering and skip a tick with NO LLM call. It only
    # has to be frequent enough for the rails to have something to filter.
    #
    # Hourly, restored 2026-07-30 (Andrew) after */30 was MEASURED and bought
    # nothing. The 07-28 switch to */30 rested on "it buys twice the chances";
    # GitHub deprioritises schedules under load and drops ticks, and it turns out
    # it drops proportionally more of a denser expression, so the extra ticks
    # evaporate. 75 scheduled runs, matched slice against matched slice:
    #
    #                 hourly   */30
    #   all hours      108.7   108.9   (median minutes between runs)
    #   daylight       135.6   149.9
    #   overnight       69.2    88.9
    #
    # Identical at best, mildly worse in every matched slice, at twice the runner
    # minutes. The delivery cadence is GitHub's to give and is ~2-hourly whatever
    # we write here; the only real levers are repository_dispatch and the reply
    # path, which already fire off-clock. Do not re-open this without new data.
    - cron: "0 * * * *"
  repository_dispatch:
    types: [knock-response, episode-rating]
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the rails gate (manual one-off knock)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write              # every lane commits: queue, knock log, mp3s, state

concurrency:
  # ONE lane for every wake-up. Replaces per-knock_id group keying (2026-07-28,
  # Andrew), whose comment claimed it protected lock-screen latency — "a reply
  # must NEVER queue behind a knock render." That was a preference written as an
  # invariant, and it was never the load-bearing property.
  #
  # What per-knock keying actually bought was DELIVERY. GitHub cancels a pending
  # run when a newer one joins its group ("any existing pending job or workflow
  # in the same concurrency group will be canceled and the new queued job or
  # workflow will take its place"), so a shared group at the default queue depth
  # of 1 would silently eat the middle of a reply burst — six dispatches landed
  # inside six minutes on 2026-07-28. Separate lanes dodged that rule; they did
  # not exist to make replies fast.
  #
  # The cost was a real parallel writer. That same morning a reply to a STALE
  # notification (the 07-27 volley, still sitting on the lock screen) ran beside
  # the reply to that morning's knock. Both appended to the tail of the
  # progress/feedback_log.json array, `git pull --rebase` hit a content conflict,
  # and commit_and_push died mid-rebase under check=True. The run went red AND
  # the judged exchange was lost — verdict, fires and ledger note all computed,
  # then thrown away with the commit.
  #
  # `queue: max` raises the group from 1 pending to 100 (GitHub changelog
  # 2026-05-07), so serialising no longer means dropping: one CI writer at a
  # time, FIFO, nothing cancelled. Andrew took the tradeoff — a reply may now
  # wait behind a render — because it removes the race structurally instead of
  # retrying around it. NB `queue: max` with `cancel-in-progress: true` is a
  # validation error; this must stay false.
  #
  # Does NOT cover the laptop, a third writer outside every group. That stays
  # the standing "pull before read, push after write" discipline.
  group: anna
  queue: max
  cancel-in-progress: false

jobs:
  anna:
    runs-on: ubuntu-latest
    # THE LANE MUST FAIL FAST, because the lane is shared (2026-08-19, Andrew).
    # `concurrency: group: anna` below is ONE serialised FIFO queue, so a job that
    # hangs does not stall itself — it stalls every knock, reply and drain behind
    # it. Without this key the bound is GitHub's platform default of 6h, and on
    # 2026-08-18 that is exactly what it cost: run 32165026119 wedged in the apt
    # step at 17:20 and was killed at the 6h ceiling, holding the lane while two
    # replies and five scheduled ticks piled up behind it. They all completed
    # within five minutes of the kill — the Actions tab reads "4h56m", but that
    # is WAIT, not work.
    #
    # 20 is ~2x the worst honest run. Real work is 30s-2min; the longest genuine
    # run measured across 100 is 8m37s (a render + feed rebuild). A run that
    # passes 20 minutes is hung, not busy.
    timeout-minutes: 20
    # Job-level env is the whole point of the consolidation: one place, every
    # capability, inherited by every step below. Adding a lane can no longer
    # mean forgetting to wire it.
    # NB: job-level env may use `secrets`, `github`, `vars`, `inputs` — but NOT
    # `runner`. `${{ runner.temp }}` here is a workflow-file VALIDATION error:
    # GitHub rejects the whole file, posts a zero-duration failed run against the
    # push, and never runs the workflow at all. It cost this file its first four
    # pushes on 2026-07-24 — silently, because the failure lands on anna.yml
    # while smoke.yml goes green beside it. Hence the literal path below (outside
    # the workspace, so a service-account key can never be swept into a commit).
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANNA_PUSH_WEBHOOK_URL: ${{ secrets.ANNA_PUSH_WEBHOOK_URL }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/anna-gcp.json
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the BRANCH at checkout time. Without this, checkout fetches
          # `github.sha` BY NAME — literally
          # `git fetch --depth=1 origin +<sha>:refs/remotes/origin/main` — and
          # that sha is frozen when the dispatch is RECEIVED, not when the job
          # runs. A run that waits its turn therefore starts from the tree as it
          # was before the run ahead of it pushed. Deliberately, every time.
          #
          # That is what failed run 30865736387 on 2026-08-04. Two replies 31s
          # apart: the concurrency gate below did its job (job B was created at
          # 00:29:43, the exact second job A completed — no parallel writer), and
          # B then checked out 187185f anyway, because that was main at 00:29:32
          # when B's dispatch landed, nine seconds before A pushed 44c4c7c. The
          # rebase in commit_and_push was left reconciling a conflict that
          # existed only because we chose to read a stale commit.
          #
          # NB the gate makes the pin WORSE. Serialising does not move the sha;
          # it lengthens the gap between pinning and checking out, so queueing
          # GUARANTEES the staleness the rebase then has to clean up. The two
          # fixes were pulling against each other. Fresh checkout + one CI writer
          # at a time is what actually closes it, and it demotes the rebase back
          # to what it should be: the net for the laptop, the only rival writer
          # left.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Install ffprobe
        # ubuntu-24.04 ships no ffmpeg (verified against the runner-images manifest:
        # MediaInfo is the only media tool present), so rebuild_rss fell through to
        # its pure-python frame scan — which on these files (TTS segments
        # concatenated with silence frames) misreads by up to 40% in either
        # direction. That reverted the whole library's durations on every cloud
        # rebuild and announced M72 as 13:12 for a 10:02 episode (2026-07-25).
        #
        # NOT on repository_dispatch. That is the lock-screen lane, where Andrew is
        # waiting on the recast — the same latency constraint that already kept
        # rendering out of the reply path. ~20s of apt in front of a reply is the
        # regression this clause exists to prevent. The cost is that a voice reply's
        # duration is first measured by the frame scan and then frozen there; on a
        # ~19s clip that is a few seconds, on a lane nobody browses by length.
        # Knocks and scheduled doses — where new library audio is actually born —
        # arrive on schedule/workflow_dispatch and do get the real probe.
        #
        # Durations are frozen at first publication, so this only has to be right
        # ONCE per file — which is why a failure here must not cost Andrew a knock.
        #
        # THIS IS THE STEP THAT HANGS, and `continue-on-error` never covered it
        # (2026-08-19). That key promises a FAILURE cannot cost a knock; a process
        # that never exits never becomes a failure, so the promise simply did not
        # apply. Measured twice, against the Azure apt mirror: 57 minutes on
        # 2026-08-17 (run 32070415338, recovered on its own, nobody noticed) and
        # unbounded on 2026-08-18 (run 32165026119, killed at the 6h ceiling).
        # Same step, same silence — no apt output at all under -qq.
        #
        # 3 minutes against a ~20s normal install. On expiry the step fails, and
        # `continue-on-error` — now actually reachable — hands the run onward to
        # rebuild_rss's pure-python frame scan. That is the documented tradeoff
        # (a duration off by up to 40% on files born in this one run) and it is
        # the cheaper half by far: the alternative just cost a whole day's lane.
        timeout-minutes: 3
        if: github.event_name != 'repository_dispatch'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Git identity
        # CI commits sign as the bot, never as a noreply alias for a real user
        # (DECISIONS: "CI git identity is github-actions[bot]").
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write GCP credentials
        # Every lane, not just the knock. This single line is the fix for the
        # 2026-07-24 refusal.
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Drain due pushes
        # Unconditional, and first. Best-effort by design: a webhook blip here
        # must not stop the reply judge below, which is the step Andrew is
        # actually waiting on. push_queue keeps an entry queued when its push
        # fails, so a skipped drain retries on the next wake-up.
        continue-on-error: true
        run: python scripts/push_queue.py drain

      - name: Judge Tamil reply
        # github.event.action is the dispatch's event_type. Both knock guards name it
        # explicitly (2026-08-27): they used to test only client_payload.response, and a
        # rating carries no `response`, so `!= 'reply'` caught it and would have marked a
        # knock landed off an event that was never a knock — letting the nudge gate back
        # off for outreach Andrew never got. Found while adding episode-rating.
        if: github.event.action == 'knock-response' && github.event.client_payload.response == 'reply'
        env:
          REPLY_TEXT: ${{ github.event.client_payload.text }}
          REPLY_KNOCK_ID: ${{ github.event.client_payload.knock_id }}
        run: python scripts/knock_reply.py "$REPLY_TEXT"

      - name: Log tap
        # --commit routes this lane through commit_and_push, the same landing
        # path the reply judge uses (2026-08-04). It used to stage/commit/pull/push
        # inline, and that hand-rolled copy had a bare `git pull --rebase` with NO
        # union resolution and no derived re-render — so the one lane that could
        # not survive a concurrent writer was the one with no net under it. Three
        # copies of a rule and one gap, and the gap is the lane that fires; same
        # shape as quiet hours moving into push_to_phone (2026-07-26).
        #
        # A no-op tap (duplicate, or one that adds nothing) commits nothing and
        # exits 0 — the `git diff --cached --quiet ||` guard moved into Python
        # with the rest of it.
        if: github.event.action == 'knock-response' && github.event.client_payload.response != 'reply'
        run: |
          python scripts/sync_state.py knock-response \
            "${{ github.event.client_payload.response }}" \
            --knock-id "${{ github.event.client_payload.knock_id }}" \
            --commit

      - name: Log soak rating
        # The phone sends whole picker lines; the integer comes off the front in
        # Python, where a smoke case can hold it. Writes one dated note into the
        # feedback ledger the Diagnosis pass already reads — this lane never
        # touches knock state, which is exactly why it is not the tap lane.
        if: github.event.action == 'episode-rating'
        env:
          RATING_MISSION: ${{ github.event.client_payload.mission }}
          RATING_STARS: ${{ github.event.client_payload.stars }}
        run: |
          python scripts/sync_state.py rate-episode             --mission "$RATING_MISSION"             --stars "$RATING_STARS"             --commit

      - name: Anna knocks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python scripts/morning_knock.py $FORCE_FLAG
